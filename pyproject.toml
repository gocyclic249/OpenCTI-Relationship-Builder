# octi-rb has no runtime dependencies -- it is Python 3 standard library only.
# This file exists to pin the lint/type settings so "strictest setting" is
# reproducible rather than a matter of which flags someone remembered.

[project]
name = "octi-rb"
version = "0.1.0"
description = "Enrich OpenCTI relationships: report containment and actor relationships"
requires-python = ">=3.11"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "F", "E", "W",      # pyflakes, pycodestyle
    "I",                # import sorting
    "UP",               # pyupgrade
    "B",                # bugbear
    "SIM", "FURB",      # simplification / modernisation
    "C4", "PTH",        # comprehensions, pathlib
    "ARG",              # unused arguments
    "TRY",              # exception antipatterns
    "S",                # bandit security
    "PL",               # pylint
    "RUF",
]
ignore = [
    # The GraphQL queries are readable as written; splitting them to satisfy
    # line length would hurt more than it helps.
    "E501",
    # TRY003: the error strings here are one-offs aimed at a human at a
    # terminal, not a caught-and-matched exception hierarchy.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
# S101: the CLI's argparse wiring is the one place a plain assert reads better
# than a raise, and it is never run under -O.
"octirb/cli.py" = []
# S101: pytest's whole idiom is the bare assert, and tests never run under -O.
# S105: literal tokens like "tok-1" in tests are fixtures, not real secrets.
# ARG001: fixtures such as `capsys` are requested for their side effect
# (patching stdout/stderr capture) even when the test never reads them back.
# PLC0415: monkeypatching a module's own attribute (e.g. `c.shutil`) needs
# that module imported inside the test, not at file scope.
# PLR2004: assertions comparing to a config's documented default value are
# the point of the test, not an unexplained magic number.
# F401: imports for interface/type context (e.g., test_report_vuln.py imports
# CVE_RE to verify the interface, even if not directly tested).
"tests/*" = ["S101", "S105", "ARG001", "PLC0415", "PLR2004", "F401"]
# RULE EXCEPTION: test-file-verbatim (Task 7 brief) - this file's content is
# specified verbatim by the sector-resolver spec, so its lint deviations are
# accepted here rather than reworded:
# F401: `Sector` is imported for readers/type context even though no
#   assertion in this file names it directly.
# ARG002: FakeClient.gql(query, variables) mirrors Client.gql's real
#   signature; the fake ignores both and always returns the fixture data.
# PLR0913/PLR0917: node() mirrors a GraphQL node's shape (id, name, author,
#   subs, parents, aliases) -- one parameter per field reads clearer split up.
# RUF005: `FILIGRAN + [...]` builds a per-test fixture list, not a hot path.
"tests/test_sectors.py" = ["F401", "ARG002", "PLR0913", "PLR0917", "RUF005"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
disallow_any_generics = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
